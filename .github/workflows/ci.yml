name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  preflight:
    name: Lint, type-check, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Install from the lockfile with uv, so CI uses the SAME pinned tool
      # versions as local dev (ruff, mypy, pytest) resolved in uv.lock. The old
      # `pip install -e ".[dev]"` pulled the loose `[project.optional-dependencies]`
      # floors (e.g. `ruff>=0.6.0`) and silently upgraded to whatever was newest on
      # PyPI — a new ruff release then flagged 900+ pre-existing lints and broke CI
      # repo-wide. `uv sync --frozen` installs exactly what uv.lock pins and never
      # re-resolves, so a tool release can no longer break the build out from under us.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy app/ mcp_server/

      - name: Test (pytest)
        run: uv run pytest -q

      # The vendored Feature Factory / review-lens engine has its own test suite
      # under docs/workflow/operations/codex-skills/. It is NOT covered by the
      # app's `pytest -q` (testpaths = ["tests"]). These tests import their sibling
      # scripts once (import-once), so the whole suite is order-independent and
      # runs in a single process. A guardrail test (test_no_sys_modules_reload)
      # fails if a test file reintroduces a sys.modules reload — which is what
      # used to force the old per-file-isolation runs.
      #
      # `-n0` forces single-process: the app's pytest `addopts` adds `-n auto`
      # (pytest-xdist) to parallelize the app suite, but this suite shares module
      # state across tests and breaks when split across xdist workers. `-n0`
      # overrides that default just for this run.
      #
      # The capture-baseline / --check wrapper enforces the test-isolation gate:
      # the suite must not create or delete ANY file under
      # docs/workflow/feature-runs/ (it uses `git status --porcelain -uall`, so it
      # catches untracked scratch run-dirs too). An autouse fixture in
      # feature-factory/conftest.py repoints factory_state's REPO_ROOT /
      # FACTORY_RUNS_ROOT at a tempdir per test; this gate fails the build if a
      # new test ever regresses that isolation and writes into the live repo tree.
      - name: Test (Feature Factory engine)
        run: |
          ISO=docs/workflow/operations/codex-skills/feature-factory/scripts/check_workflow_isolation.py
          uv run python "$ISO" --capture-baseline "$RUNNER_TEMP/ff-isolation-baseline.json"
          uv run python -m pytest docs/workflow/operations/codex-skills -q -n0
          uv run python "$ISO" --check --baseline "$RUNNER_TEMP/ff-isolation-baseline.json"
