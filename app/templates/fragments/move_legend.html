{# The three moves, shown not described. The effect text means color is never
   the only cue — each chip reads on its own (accessibility). #}
<ul class="move-legend" aria-label="The three moves">
    <li class="hchip hoard"><span class="hchip-move">Hoard</span> <span class="hchip-eff">{{ hoard_legend() }}</span></li>
    <li class="hchip hurt"><span class="hchip-move">Hurt</span> <span class="hchip-eff">{{ hurt_legend() }}</span></li>
    <li class="hchip help"><span class="hchip-move">Help</span> <span class="hchip-eff">{{ help_legend(default_mutual_help_mode) }}</span></li>
</ul>
