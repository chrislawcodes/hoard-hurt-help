[[adjudicated]]
candidate = "Turn-loop twins: merge `_all_submitted`/`_all_messaged` + the two wait loops (`scheduler_turn_loop.py`)"
why = "Real duplication, adjudicated leave-as-is: this is the code that freezes live games when it breaks (G_0012, M_0279) and the payoff is ~40 lines. Boring, separate functions are the safety feature. Owner call, 2026-07-04."
evidence = "Tier 4 close-out of the refactoring survey (see STATUS.md entry + its PR)"

[[adjudicated]]
candidate = "Split `scripts/agentludum_connector.py` into a package"
why = "Deferred, not refused: operators install by copying the one file, so a split first requires a distribution change (e.g. zipapp) and a one-time re-install for everyone. Section banners added instead. Revisit only if the install story changes."
evidence = "Tier 4 close-out of the refactoring survey (see STATUS.md entry + its PR)"

# --- reexports (PR C) ---------------------------------------------------------
# verdict is one of: leave | unjudged
#   leave    = looked at, re-exporting here on purpose (e.g. a thin assembler).
#   unjudged = nobody has looked at this module's re-exports yet.
#
# Read by:
#   - tests/test_reexports_have_one_home.py — fails the build when a module's
#     __all__ re-exports (imports, never defines) a name with no entry here, or
#     when a recorded entry's names have gone stale.
#
# `names` lists every name in that module's __all__ that is bound only by an
# import there, never a def/class/assignment. The module that actually defines
