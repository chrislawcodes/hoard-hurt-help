# --- import_cycles (S3) ---

[[import_cycles]]
modules = ["app.engine.scheduler", "app.engine.scheduler_turn_loop"]
note = """PR S6: left in place on purpose, not missed. scheduler.py imports
_run_game/_wait_for_messages/_wait_for_turn from scheduler_turn_loop.py (so
they exist as its own attributes), and scheduler_turn_loop.py reads them back
via a lazy `from app.engine import scheduler` so the test suite's
`scheduler.publish` etc. patches reach it (PR M's reexports verdict, same
file, `_run_game` entry). Both halves of that mechanism are required; cutting
either breaks the patch surface. Every OTHER cycle recorded here at PR M time
that ran through these six modules (arena, scheduler, user_match_start,
overdue_sweeper, scheduler_turn_loop, turn_drivers) was untangled instead:
`is_bot_kind` moved to the new leaf module app/engine/bot_kind.py (it had no
dependency on the rest of user_match_start.py), and scheduler.py's poll loop
now takes `start_game` from its own module scope and `sweep_overdue_turns` as
a parameter from app/main.py instead of importing arena.py/overdue_sweeper.py
back into itself."""

# --- test_fixtures (T1) ---
# tests/conftest.py is the declared home for `reset_db`, `engine`,
# `session_factory`, `db`, `client`, `db_session`, and `app` — plus
# `reset_pull_rate_limit` / `admin_settings` for the two one-line
# monkeypatches several test files used to copy the whole `reset_db`
# fixture just to add. A `def`/`async def` under a tests/test_*.py file
# decorated `@pytest.fixture` whose name matches one of the first seven
# names above is checked against the [[test_fixtures]] table below.
#
# This PR (T1) only lands the baseline — every hit that exists today,
# all unjudged. It removes no copies itself; later PRs in this cleanup
# migrate individual files to the shared conftest fixtures (or the two
# new compose-in ones) and flip their verdict to "merged", or record
# "leave" for a fixture that only looks like the shared one.
#
# Read by tests/test_fixtures_have_one_home.py, which fails the build
# when a new (file, fixture name) copy appears with no matching entry
# here, when a "merged" entry's copy has come back, or when a recorded
# "unjudged"/"leave" entry's fixture is gone from that file.
#
# verdict is one of: leave | merged | rename | unjudged
#   leave    = looked at, kept as its own definition on purpose.
#   merged   = it used to be a copy; the merge landed, so this (file,
#              name) pair should NOT be found by the test any more.
#   rename   = kept, but renamed to something that says what differs —
#              the scanner only looks for the original tracked name, so
#              this entry is never re-found (like "merged") but keeps a
#              record of why the copy survives under a new name.
#   unjudged = nobody has looked at this one yet — today's baseline
#              (T1), so the count can only fall from here.
#
# T2 migrated every T1 baseline hit to merged/leave/rename — none remain
# unjudged.

