# --- scanner_hits ------------------------------------------------------------
# check is one of: guard_gap | repeated_predicate
# key is the finding's header text exactly as scripts/find_duplicate_rules.py
# prints it: "Model.field" for a guard_gap, "[Model.field, Model.field, ...]"
# (brackets included) for a repeated_predicate.
#
# [Turn.match_id, Turn.round, Turn.turn] is deliberately NOT listed here — PR H
# fixes that one, so it should keep showing up as a live candidate until then.

[[scanner_hits]]
check = "guard_gap"
key = "Connection.deleted_at"
verdict = "leave"
note = "callers delegate to assert_connection_usable"

[[scanner_hits]]
check = "guard_gap"
key = "ConnectionSetup.completed_at"
verdict = "leave"
note = "flagged callers are update() writers"

[[scanner_hits]]
check = "guard_gap"
key = "Player.left_at"
verdict = "leave"
note = "incidental Player touches, no rule"

[[scanner_hits]]
check = "repeated_predicate"
key = "[Connection.deleted_at, Connection.mcp_connected_at, Connection.user_id]"
verdict = "leave"
note = "opposites: is_(None) vs is_not(None)"

# --- adjudicated --------------------------------------------------------------
# Mirrors the "Refactors adjudicated" table in
# .claude/skills/failure-archaeology/SKILL.md — candidate is that table's first
# column, verbatim. tests/test_one_home_ratchet.py checks the two stay in sync.

