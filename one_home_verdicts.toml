evidence = "dedup run docs/workflow/feature-runs/dedup-bots/, PR #563"

[[adjudicated]]
candidate = "Turn-loop twins: merge `_all_submitted`/`_all_messaged` + the two wait loops (`scheduler_turn_loop.py`)"
why = "Real duplication, adjudicated leave-as-is: this is the code that freezes live games when it breaks (G_0012, M_0279) and the payoff is ~40 lines. Boring, separate functions are the safety feature. Owner call, 2026-07-04."
evidence = "Tier 4 close-out of the refactoring survey (see STATUS.md entry + its PR)"

[[adjudicated]]
