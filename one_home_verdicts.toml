# --- scanner_hits ------------------------------------------------------------
# check is one of: guard_gap | repeated_predicate
# key is the finding's header text exactly as scripts/find_duplicate_rules.py
# prints it: "Model.field" for a guard_gap, "[Model.field, Model.field, ...]"
# (brackets included) for a repeated_predicate.

[[scanner_hits]]
check = "guard_gap"
key = "Connection.deleted_at"
verdict = "leave"
note = "callers delegate to assert_connection_usable"

[[scanner_hits]]
check = "guard_gap"
key = "ConnectionSetup.completed_at"
verdict = "leave"
note = "flagged callers are update() writers"

[[scanner_hits]]
check = "guard_gap"
key = "Player.left_at"
verdict = "leave"
note = "incidental Player touches, no rule"

[[scanner_hits]]
check = "repeated_predicate"
key = "[Connection.deleted_at, Connection.mcp_connected_at, Connection.user_id]"
verdict = "leave"
note = "opposites: is_(None) vs is_not(None)"

[[scanner_hits]]
check = "repeated_predicate"
key = "[Turn.match_id, Turn.round, Turn.turn]"
verdict = "leave"
note = "remaining sites order all turns; the position lookup lives in load_turn_at"

# --- adjudicated --------------------------------------------------------------
# Mirrors the "Refactors adjudicated" table in
# .claude/skills/failure-archaeology/SKILL.md — candidate is that table's first
# column, verbatim. tests/test_one_home_ratchet.py checks the two stay in sync.

[[adjudicated]]
candidate = "C2: unify the two turn-row openers"
why = "One is get-or-create (resume-safe), the other a blind INSERT — behaviorally different on purpose (the G_0012 lesson)."
evidence = "dedup run docs/workflow/feature-runs/dedup-engine-cseries/, PR #559"

[[adjudicated]]
candidate = "D5: extract a `pick_by_trust` helper from 6 seeded trust-tiebreak selectors"
why = "Per-site seed args / access patterns / signs differ; a shared helper adds determinism risk with no real dedup. Sites pinned by a determinism regression test."
evidence = "dedup run docs/workflow/feature-runs/dedup-bots/, PR #563"

[[adjudicated]]
candidate = "Turn-loop twins: merge `_all_submitted`/`_all_messaged` + the two wait loops (`scheduler_turn_loop.py`)"
why = "Real duplication, adjudicated leave-as-is: this is the code that freezes live games when it breaks (G_0012, M_0279) and the payoff is ~40 lines. Boring, separate functions are the safety feature. Owner call, 2026-07-04."
evidence = "Tier 4 close-out of the refactoring survey (see STATUS.md entry + its PR)"

[[adjudicated]]
candidate = "Split `scripts/agentludum_connector.py` into a package"
why = "Deferred, not refused: operators install by copying the one file, so a split first requires a distribution change (e.g. zipapp) and a one-time re-install for everyone. Section banners added instead. Revisit only if the install story changes."
evidence = "Tier 4 close-out of the refactoring survey (see STATUS.md entry + its PR)"

# --- reexports (PR C) ---------------------------------------------------------
# verdict is one of: leave | unjudged
#   leave    = looked at, re-exporting here on purpose (e.g. a thin assembler).
#   unjudged = nobody has looked at this module's re-exports yet.
#
# Read by:
#   - tests/test_reexports_have_one_home.py — fails the build when a module's
#     __all__ re-exports (imports, never defines) a name with no entry here, or
#     when a recorded entry's names have gone stale.
#
# `names` lists every name in that module's __all__ that is bound only by an
# import there, never a def/class/assignment. The module that actually defines
# each name isn't repeated here — read that module's own imports to find it.
# PR C emptied app/engine/connection_health.py and three route aggregators
# (app/routes/agents_setup.py, connections_setup.py, web_player.py) of exactly
# this pattern; those four have no entry below because they no longer qualify.

