# one_home_verdicts.toml
#
# The record of "we judged this duplicate" for this repo's One Home Per Rule
# rule (see CLAUDE.md). Every entry below is a decision a person already made
# about one hit from scripts/find_duplicate_rules.py — this file is the one
# place that decision lives, so nobody has to re-decide it, and so a NEW hit
# of the same shape can't slip in unnoticed.
#
# Read by:
#   - scripts/find_duplicate_rules.py — hides a hit once it has an entry here
#     (function_names: any verdict but "unjudged"; scanner_hits: any entry
#     at all), and still prints the ones nobody has judged yet.
#   - tests/test_one_home_ratchet.py — fails the build when a new same-name
#     function appears in two files with no entry here, when a recorded
#     entry's file list has gone stale, or when a "merged" entry's duplicate
#     has come back.
#
# `pr` records which lettered PR of the "One Home, Kept" plan last set that
# verdict. Every entry below was set in PR A, which introduced this file.

# --- function_names ---------------------------------------------------------
# verdict is one of: protocol | leave | rename | merged | unjudged
#   protocol = every file is under app/games/ — one function per game is the
#              expected shape, not a duplicate to fix.
#   leave    = looked at, kept as two definitions on purpose.
#   rename   = looked at, will be told apart by a rename rather than merged.
#   merged   = it used to be duplicated; the merge landed, so this name
#              should NOT be found by the scanner any more.
#   unjudged = nobody has looked at this pair yet.

[[function_names]]
name = "_best_partner"
files = ["app/engine/bots/strategies.py", "app/engine/bots/trust.py"]
verdict = "unjudged"
note = ""
pr = "PR A"

