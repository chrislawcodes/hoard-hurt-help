# --- test_helpers (PR D) ---
# Same idea as function_names above, but for tests/*.py seeding helpers.
# tests/factories.py is the declared home (make_user, make_connection,
# make_agent, make_version, make_match, make_turn, add_submission,
# seat_player, seat_prebuilt_player, make_bot). A module-level `def`/`async
# def` under tests/ (excluding factories.py and conftest.py) whose name
# matches `^_?(seed|make|create)_` and is defined in two or more files
# belongs here instead of a fresh copy.
#
# Read by tests/test_test_helpers_have_one_home.py, which fails the build
# when a new such name (or a new file for an existing one) appears with no
# matching entry here, when a recorded unjudged/leave entry can no longer be
# found, or when a "merged" entry's duplicate has come back.
#
# verdict is one of: leave | merged | unjudged
#   leave    = looked at, kept as two (or more) definitions on purpose.
#   merged   = it used to be duplicated; the merge landed, so this name
#              should NOT be found by the test any more. Carries a `home`
#              key naming the module the merged copy now lives in — the
#              ratchet test names it when a copy comes back.
#   unjudged = nobody has looked at this one yet — today's baseline, so the
#              count can only fall from here.

